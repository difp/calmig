name: CalmIG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
      - run: cargo fmt --manifest-path quiet-desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path rust-core/Cargo.toml
      - run: cargo test --manifest-path quiet-desktop/src-tauri/Cargo.toml
      - run: ./quiet-desktop/build.sh
