name: CalmIG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Node dependencies
        run: npm ci
      - name: Check TypeScript and build CLI
        run: npm run build
      - name: Check code and run tests
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path quiet-desktop/src-tauri/Cargo.toml -- --check
      - name: Build desktop application
        run: ./quiet-desktop/build.sh
      - name: Check local bridge
        run: node quiet-desktop/tests/bridge.test.cjs
